<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Human Heart Digital Twin</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-bg"></div>
    <header class="topbar">
      <div>
        <h1>HUMAN HEART DIGITAL TWIN</h1>
        <p class="subtitle">Real-time Cardiac Monitoring &amp; Risk Assessment</p>
      </div>
      <div class="status-wrap">
        <span class="live-pill" id="liveIndicator">● LIVE</span>
        <span class="clock" id="clock">--:--:--</span>
      </div>
    </header>

    <main class="grid">
      <section class="metrics" id="metricGrid"></section>

      <section class="panel inputs">
        <h2>Patient Inputs</h2>
        <div id="patientInputs" class="list"></div>
      </section>

      <section class="panel twin">
        <h2>3D Heart Digital Twin</h2>
        <div class="twin-body">
          <div class="heart-stage">
            <div class="heart-glow"></div>
            <div id="heart" class="heart">❤️</div>
            <div class="pulse-ring ring-1"></div>
            <div class="pulse-ring ring-2"></div>
            <div class="pulse-ring ring-3"></div>
          </div>
          <div class="twin-stats" id="twinStats"></div>
        </div>
      </section>

      <section class="panel risk">
        <h2>Overall Risk</h2>
        <div class="risk-gauge">
          <div class="gauge-arc"></div>
          <div class="risk-value" id="riskPercent">0%</div>
          <p id="riskLevel">Low Risk</p>
        </div>
        <ul id="riskItems" class="risk-list"></ul>
      </section>

      <section class="panel ecg">
        <h2>ECG Waveform</h2>
        <canvas id="ecgCanvas" width="800" height="230"></canvas>
      </section>

      <section class="panel trends">
        <h2>Trends (Last 10 min)</h2>
        <canvas id="trendCanvas" width="800" height="230"></canvas>
      </section>
    </main>

    <script type="module" src="app.js"></script>
  </body>
</html>
